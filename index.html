<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SixTONES 楽曲ソート</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif; }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex flex-col justify-between">

  <!-- ヘッダー -->
  <header class="p-4 text-center border-b border-zinc-800">
    <h1 class="text-2xl font-black tracking-wider text-red-600">SixTONES SONG SORT</h1>
    <p class="text-xs text-zinc-400 mt-1">あなただけのSixTONES楽曲ランキングを作ろう</p>
  </header>

  <main class="container mx-auto px-4 py-6 max-w-xl flex-grow flex flex-col justify-center">

    <!-- スタート画面 -->
    <div id="start-screen" class="text-center space-y-6">
      <div class="bg-zinc-900 p-6 rounded-2xl border border-zinc-800 shadow-xl">
        <h2 class="text-lg font-bold mb-2">どちらが好きか選ぶだけ！</h2>
        <p class="text-sm text-zinc-400 mb-6">曲を聴き比べながら、より好きな方のカードをタップしてください。</p>
        <button id="start-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-xl shadow-lg transition active:scale-95">
          ソートを始める
        </button>
      </div>
    </div>

    <!-- 質問画面 -->
    <div id="sort-screen" class="hidden space-y-4">
      <div class="space-y-1">
        <div class="flex justify-between text-xs text-zinc-400">
          <span>進捗</span>
          <span id="progress-text">0%</span>
        </div>
        <div class="w-full bg-zinc-800 h-2 rounded-full overflow-hidden">
          <div id="progress-bar" class="bg-red-600 h-full w-0 transition-all duration-300"></div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3 sm:gap-4 mt-4">
        
        <!-- 左楽曲エリア -->
        <div class="flex flex-col items-center space-y-3">
          <!-- Spotify 埋め込みプレイヤー（ジャケット＋試聴機能一体型） -->
          <div class="w-full aspect-square bg-zinc-900 rounded-2xl overflow-hidden shadow-lg border border-zinc-800">
            <iframe id="spotify-player-left" src="" width="100%" height="100%" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
          </div>
          <button id="card-left" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl shadow transition active:scale-95 text-sm">
            左の曲が好き！
          </button>
        </div>

        <!-- 右楽曲エリア -->
        <div class="flex flex-col items-center space-y-3">
          <!-- Spotify 埋め込みプレイヤー（ジャケット＋試聴機能一体型） -->
          <div class="w-full aspect-square bg-zinc-900 rounded-2xl overflow-hidden shadow-lg border border-zinc-800">
            <iframe id="spotify-player-right" src="" width="100%" height="100%" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
          </div>
          <button id="card-right" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl shadow transition active:scale-95 text-sm">
            右の曲が好き！
          </button>
        </div>

      </div>

      <button id="draw-btn" class="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs py-2 rounded-lg mt-2">
        どちらも同じくらい好き / わからない
      </button>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="hidden space-y-6">
      <div id="capture-area" class="bg-zinc-900 p-6 rounded-2xl border border-zinc-800 space-y-4">
        <div class="text-center border-b border-zinc-800 pb-3">
          <p class="text-xs text-red-500 font-bold uppercase tracking-widest">My SixTONES Top 10</p>
          <h2 class="text-xl font-black">あなたのSixTONES TOP 10</h2>
        </div>
        <div id="result-list" class="space-y-2"></div>
      </div>

      <div class="space-y-3">
        <button id="save-img-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl shadow transition">
          画像として保存する
        </button>
        <button id="share-x-btn" class="w-full bg-black hover:bg-zinc-800 text-white font-bold py-3 rounded-xl border border-zinc-700 transition">
          X (Twitter) でシェア
        </button>
        <button id="restart-btn" class="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold py-3 rounded-xl transition">
          もう一度ソートする
        </button>
      </div>
    </div>

  </main>

  <footer class="p-4 text-center text-xs text-zinc-600 border-t border-zinc-900">
    SixTONES Fan Made App
  </footer>

  <script>
    let songData = [];
    let lstMember = [], rec = [];
    let head1 = 0, head2 = 0;
    let ncmp = 0, totalQuestions = 0;
    let finished = false;
    let sortedList = [];

    async function loadSongs() {
      try {
        const response = await fetch('songs.json');
        songData = await response.json();
      } catch (error) {
        alert('songs.json の読み込みに失敗しました。');
      }
    }

    function initSort() {
      const n = songData.length;
      lstMember = [];
      rec = [];
      ncmp = 0;
      finished = false;

      for (let i = 0; i < n; i++) lstMember.push([i]);

      while (lstMember.length > 1) {
        let nextLst = [];
        for (let i = 0; i < lstMember.length; i += 2) {
          if (i + 1 < lstMember.length) {
            nextLst.push({ left: lstMember[i], right: lstMember[i+1] });
          } else {
            nextLst.push(lstMember[i]);
          }
        }
        lstMember = nextLst;
      }

      totalQuestions = Math.floor(n * Math.log2(n));
      prepareNextMerge();
      showQuestion();
    }

    function prepareNextMerge() {
      if (typeof lstMember[0] === 'object' && !Array.isArray(lstMember[0])) {
        head1 = 0; head2 = 0; rec = [];
      } else {
        finished = true;
        sortedList = lstMember[0].map(index => songData[index]);
        showResult();
      }
    }

    function showQuestion() {
      if (finished) return;

      const currentBlock = lstMember[0];
      if (Array.isArray(currentBlock)) {
        prepareNextMerge();
        return;
      }

      const leftSong = songData[currentBlock.left[head1]];
      const rightSong = songData[currentBlock.right[head2]];

      // Spotify 埋め込みプレイヤー描画（ジャケット＋再生ボタン付き）
      document.getElementById('spotify-player-left').src = `https://open.spotify.com/embed/track/${leftSong.track_id}?utm_source=generator&theme=0`;
      document.getElementById('spotify-player-right').src = `https://open.spotify.com/embed/track/${rightSong.track_id}?utm_source=generator&theme=0`;

      // 進捗率
      const percent = Math.min(Math.round((ncmp / totalQuestions) * 100), 99);
      document.getElementById('progress-bar').style.width = percent + '%';
      document.getElementById('progress-text').innerText = percent + '%';
    }

    function handleAnswer(flag) {
      if (finished) return;
      ncmp++;
      const currentBlock = lstMember[0];

      if (flag === -1) {
        rec.push(currentBlock.left[head1]);
        head1++;
      } else if (flag === 1) {
        rec.push(currentBlock.right[head2]);
        head2++;
      } else {
        rec.push(currentBlock.left[head1]);
        rec.push(currentBlock.right[head2]);
        head1++; head2++;
      }

      if (head1 >= currentBlock.left.length) {
        while (head2 < currentBlock.right.length) {
          rec.push(currentBlock.right[head2]); head2++;
        }
        completeMerge();
      } else if (head2 >= currentBlock.right.length) {
        while (head1 < currentBlock.left.length) {
          rec.push(currentBlock.left[head1]); head1++;
        }
        completeMerge();
      } else {
        showQuestion();
      }
    }

    function completeMerge() {
      lstMember.shift();
      lstMember.push(rec);
      prepareNextMerge();
      if (!finished) showQuestion();
    }

    function showResult() {
      document.getElementById('sort-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');

      const resultListEl = document.getElementById('result-list');
      resultListEl.innerHTML = '';

      const top10 = sortedList.slice(0, 10);
      top10.forEach((song, idx) => {
        const rank = idx + 1;
        const item = document.createElement('div');
        item.className = 'flex items-center gap-3 p-2 bg-zinc-950 rounded-xl border border-zinc-800/80';
        item.innerHTML = `
          <div class="font-black text-lg w-6 text-center ${rank <= 3 ? 'text-red-500' : 'text-zinc-500'}">${rank}</div>
          <div class="flex-grow min-w-0">
            <p class="font-bold text-sm truncate">${song.title}</p>
            <p class="text-xs text-zinc-500 truncate">${song.album}</p>
          </div>
          <a href="https://open.spotify.com/track/${song.track_id}" target="_blank" rel="noopener noreferrer" class="text-xs bg-zinc-800 text-zinc-300 px-2 py-1 rounded">Spotify ↗</a>
        `;
        resultListEl.appendChild(item);
      });
    }

    // イベント
    document.getElementById('start-btn').addEventListener('click', () => {
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('sort-screen').classList.remove('hidden');
      initSort();
    });

    document.getElementById('card-left').addEventListener('click', () => handleAnswer(-1));
    document.getElementById('card-right').addEventListener('click', () => handleAnswer(1));
    document.getElementById('draw-btn').addEventListener('click', () => handleAnswer(0));

    document.getElementById('save-img-btn').addEventListener('click', () => {
      html2canvas(document.getElementById('capture-area'), {
        backgroundColor: '#18181b',
        scale: 2
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'My_SixTONES_Top10.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    });

    document.getElementById('share-x-btn').addEventListener('click', () => {
      const top1 = sortedList[0] ? sortedList[0].title : '';
      const top2 = sortedList[1] ? sortedList[1].title : '';
      const top3 = sortedList[2] ? sortedList[2].title : '';
      const text = `私のSixTONES楽曲 TOP3は…\n🥇 ${top1}\n🥈 ${top2}\n🥉 ${top3}\n\n#SixTONES楽曲ソート #SixTONES`;
      window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(window.location.href)}`, '_blank');
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
    });

    window.addEventListener('DOMContentLoaded', loadSongs);
  </script>
</body>
</html>
